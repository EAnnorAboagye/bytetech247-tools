name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Astro check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  deploy:
    # CI builds then deploys via `wrangler deploy` as an explicit step —
    # there is no Pages project and no dashboard Git integration on this
    # Worker to auto-build on push (verify that manually in the Cloudflare
    # dashboard: Settings -> Builds should have no "Connect to Git"
    # integration). Requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
    # as repo secrets (Settings -> Secrets and variables -> Actions) before
    # this job can actually deploy; it will fail loudly without them
    # rather than silently no-op.
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
